<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0e1116;
        --ink: #f6f3ee;
        --accent: #ff5a36;
        --muted: #9aa3ae;
        --font-display: "Inter";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
      #glow {
        position: absolute;
        inset: 0;
      }
      #glow-disc {
        position: absolute;
        left: 140px;
        top: 560px;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 90, 54, 0.32) 0%, rgba(255, 90, 54, 0) 70%);
      }
      #headline {
        position: absolute;
        left: 120px;
        right: 120px;
        top: 860px;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #headline-text {
        color: var(--ink);
        font-size: 100px;
        font-weight: 900;
        letter-spacing: -0.04em;
        white-space: nowrap;
      }
      #bar {
        position: absolute;
        left: 290px;
        top: 1080px;
        width: 500px;
        height: 14px;
      }
      #bar-fill {
        width: 100%;
        height: 100%;
        border-radius: 7px;
        background: var(--accent);
        transform-origin: left center;
      }
      #label {
        position: absolute;
        left: 120px;
        right: 120px;
        top: 760px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #label-text {
        color: var(--muted);
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div id="glow" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="glow-disc"></div>
      </div>
      <div id="label" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <span id="label-text">Sistema de Reels</span>
      </div>
      <div id="headline" class="clip" data-start="0" data-duration="5" data-track-index="2">
        <span id="headline-text">Vídeo teste</span>
      </div>
      <div id="bar" class="clip" data-start="0" data-duration="5" data-track-index="3">
        <div id="bar-fill"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Frame 0 already shows the title; everything keeps moving until the end.
      tl.fromTo("#glow-disc", { scale: 0.85, opacity: 0.7 }, { scale: 1.15, opacity: 1, duration: 5, ease: "sine.inOut" }, 0);
      tl.fromTo("#headline-text", { scale: 0.94, opacity: 0.85 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#headline-text", { y: 0 }, { y: -12, duration: 4.4, ease: "sine.inOut" }, 0.6);
      tl.fromTo("#label-text", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo("#bar-fill", { scaleX: 0.05 }, { scaleX: 1, duration: 4.2, ease: "power2.inOut" }, 0.2);
      tl.to("#headline-text", { scale: 1.04, duration: 0.4, ease: "power2.out" }, 4.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
